[project]
name = "saige-worker"
version = "0.1.0"
description = "Saige Vault background worker (document processing, sync, indexing)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "saq[redis,hiredis]>=0.26",
    "saige-api",
    "saige-ai",
]

[project.scripts]
saige-worker = "saige_worker.main:run"

[tool.uv.sources]
saige-api = { workspace = true }
saige-ai = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saige_worker"]

[project]
name = "saige-ai"
version = "0.1.0"
description = "Saige Vault AI provider abstractions (LLM, embeddings, reranking, OCR)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saige_ai"]

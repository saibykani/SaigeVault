name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (API, worker, AI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: saige
          POSTGRES_PASSWORD: saige
          POSTGRES_DB: saige_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U saige -d saige_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://saige:saige@localhost:5432/saige_test
      TEST_REDIS_URL: redis://localhost:6379/15
      DATABASE_URL: postgresql+asyncpg://saige:saige@localhost:5432/saige_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy services/api/src services/worker/src services/ai/src
      - name: Tests (unit + integration against PostgreSQL)
        run: uv run pytest --cov=saige_api --cov=saige_worker --cov=saige_ai --cov-report=term
      - name: Migrations match models
        run: uv run alembic -c services/api/alembic.ini check
      - name: OpenAPI spec is up to date
        run: |
          uv run saige-export-openapi /tmp/openapi.json
          diff -u docs/api/openapi.json /tmp/openapi.json
      - name: Generated TypeScript enums are up to date
        run: uv run python scripts/generate_ts_enums.py --check

  web:
    name: Web + TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: API client matches OpenAPI spec
        run: npm run codegen && git diff --exit-code packages/api-client/src/schema.gen.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - name: End-to-end tests (Playwright)
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  ios:
    name: iOS (build + XCTest)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build and test
        run: bash apps/ios/scripts/ci-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: apps/ios/build/TestResults.xcresult
          retention-days: 7

  android:
    name: Android (build + unit tests + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      # Steps are skipped until the Android shell (Gradle wrapper) lands.
      - uses: actions/setup-java@v5
        if: hashFiles('apps/android/gradlew') != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: hashFiles('apps/android/gradlew') != ''
      - if: hashFiles('apps/android/gradlew') != ''
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - if: hashFiles('apps/android/gradlew') != ''
        run: ./gradlew --no-daemon bundleRelease -Psaige.apiBaseUrl=https://vault.invalid
      - uses: actions/upload-artifact@v4
        if: hashFiles('apps/android/gradlew') != ''
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build api, worker and web images
        run: docker compose build api worker web

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
      - name: Python dependency audit
        run: uv sync --frozen && uv run pip-audit --skip-editable
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: npm dependency audit (high and above)
        run: npm ci && npm audit --audit-level=high --omit=dev

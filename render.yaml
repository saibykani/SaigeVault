# Render Blueprint — free hosting for the Saige Vault API.
# Render dashboard → New → Blueprint → pick this repository.
# Full guide: docs/deployment/free-hosting.md
#
# Database (Neon) and Redis (Upstash) are external free services; paste
# their URLs when Render asks. Render generates JWT_SECRET and
# TOKEN_ENCRYPTION_KEY for you — they never appear in the repository.
services:
  - type: web
    name: saige-vault-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    # The image's entrypoint applies migrations and serves on Render's $PORT.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Paste from Neon (Connection string). Any postgresql:// URL works.
      - key: DATABASE_URL
        sync: false
      # Optional: Upstash rediss:// URL. Leave empty to keep state in-process
      # (fine for a single free instance).
      - key: REDIS_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # From Google Cloud Console → Credentials → OAuth client (Web application).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Your Vercel address. Change these three if your domain differs.
      - key: WEB_PUBLIC_URL
        value: https://saigevault.vercel.app
      - key: GOOGLE_REDIRECT_URI
        value: https://saigevault.vercel.app/api/v1/auth/google/callback
      - key: CORS_ALLOWED_ORIGINS
        value: https://saigevault.vercel.app
      - key: AI_PROCESSING_POLICY
        value: disabled

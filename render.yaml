# Render Blueprint — free hosting for the Saige Vault API.
# Render dashboard → New → Blueprint → pick this repository.
# Full guide: docs/deployment/free-hosting.md
#
# MongoDB (Atlas) and Cloudflare R2 are external free services; paste
# their settings when Render asks. Render generates JWT_SECRET and
# TOKEN_ENCRYPTION_KEY for you — they never appear in the repository.
services:
  - type: web
    name: saige-vault-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infrastructure/docker/backend.Dockerfile
    dockerContext: .
    # The image serves on Render's $PORT and creates MongoDB indexes on start.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # MongoDB Atlas connection string, with the database name after .net/
      # e.g. mongodb+srv://user:pass@cluster.mongodb.net/saige_vault?appName=x
      # (write any @ inside the password as %40).
      - key: MONGODB_URI
        sync: false
      # Cloudflare R2 → R2 Object Storage → Manage API tokens (Object Read & Write).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: saige-vault
      # Optional: Upstash rediss:// URL. Leave empty to keep state in-process
      # (fine for a single free instance).
      - key: REDIS_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      # From Google Cloud Console → Credentials → OAuth client (Web application).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Your Vercel address. Change these three if your domain differs.
      - key: WEB_PUBLIC_URL
        value: https://saigevault.vercel.app
      - key: GOOGLE_REDIRECT_URI
        value: https://saigevault.vercel.app/api/v1/auth/google/callback
      - key: CORS_ALLOWED_ORIGINS
        value: https://saigevault.vercel.app
      - key: AI_PROCESSING_POLICY
        value: disabled

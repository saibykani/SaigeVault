# XcodeGen spec — the .xcodeproj is generated and never committed.
#   brew install xcodegen && xcodegen generate
# See docs/mobile/ios.md.
name: SaigeVault
options:
  bundleIdPrefix: com.saige
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  SaigeVault:
    type: application
    platform: iOS
    sources:
      - path: SaigeVault
    info:
      path: SaigeVault/Info.plist
      properties:
        CFBundleDisplayName: Saige Vault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SaigeAPIBaseURL: $(SAIGE_API_BASE_URL)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: Saige Vault uses Face ID to unlock your private documents.
        # ATS stays strict (HTTPS only). Local networking is allowed so a
        # development build can reach a Saige server on your Mac/LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Saige Vault connects to your self-hosted Saige server on your local network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SAIGE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(SAIGE_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - SaigeVaultTests
        - SaigeVaultUITests
      gatherCoverageData: true

  SaigeVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SaigeVaultTests]
    dependencies:
      - target: SaigeVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SAIGE_BUNDLE_ID).tests

  SaigeVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SaigeVaultUITests]
    dependencies:
      - target: SaigeVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(SAIGE_BUNDLE_ID).uitests
        TEST_TARGET_NAME: SaigeVault
